name: Build and Deploy Portfolio to Homelab

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install Dependencies
        run: npm ci

      - name: Build Portfolio
        run: npm run build

      - name: Install cloudflared
        run: |
          wget https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x cloudflared-linux-amd64
          sudo mv cloudflared-linux-amd64 /usr/local/bin/cloudflared

      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Configure SSH
        run: |
          cat > ~/.ssh/config <<EOF
          Host ssh.nabinlabs.in
            User ${{ secrets.SERVER_USER }}
            IdentityFile ~/.ssh/id_ed25519
            ProxyCommand /usr/local/bin/cloudflared access ssh --hostname %h
            StrictHostKeyChecking no
          EOF

      - name: Deploy Portfolio
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}

        run: |

          export TUNNEL_SERVICE_TOKEN_ID=$CF_ACCESS_CLIENT_ID
          export TUNNEL_SERVICE_TOKEN_SECRET=$CF_ACCESS_CLIENT_SECRET

          echo "🧹 Preparing deployment directories..."

          ssh ssh.nabinlabs.in "
            mkdir -p /opt/apps/Portfolio &&
            rm -rf /opt/apps/Portfolio/dist_old
          "

          echo "🚀 Uploading build..."

          scp -r ./dist \
            ssh.nabinlabs.in:/opt/apps/Portfolio/dist_new

          echo "🔄 Swapping builds..."

          ssh ssh.nabinlabs.in "
            if [ -d /opt/apps/Portfolio/dist ]; then
              mv /opt/apps/Portfolio/dist /opt/apps/Portfolio/dist_old
            fi

            mv /opt/apps/Portfolio/dist_new /opt/apps/Portfolio/dist

            rm -rf /opt/apps/Portfolio/dist_old
          "

          echo "🎉 Deployment successful!"